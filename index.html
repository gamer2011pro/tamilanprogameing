<!DOCTYPE html>
<html>
<head>
<title>Tamilan Pro Gameing</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #0f0f0f, #1a0033);
    color: white;
    text-align: center;
    overflow-x: hidden;
}

/* Neon animated background glow */
body::before {
    content: "";
    position: fixed;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle, #ff00ff33, transparent 70%);
    animation: animateBg 10s linear infinite;
    z-index: -1;
}

@keyframes animateBg {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

header {
    font-size: 40px;
    padding: 20px;
    color: #00ffff;
    text-shadow: 0 0 10px #00ffff, 0 0 20px #ff00ff;
}

.game-container {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
}

.game-card {
    background: rgba(0,0,0,0.7);
    margin: 20px;
    padding: 20px;
    width: 250px;
    border-radius: 15px;
    box-shadow: 0 0 15px #ff00ff;
    transition: 0.3s;
}

.game-card:hover {
    transform: scale(1.1);
    box-shadow: 0 0 25px cyan;
}

button {
    padding: 10px 20px;
    background: linear-gradient(45deg, #ff00ff, #00ffff);
    border: none;
    color: black;
    font-weight: bold;
    cursor: pointer;
    border-radius: 20px;
}

button:hover {
    box-shadow: 0 0 15px white;
}

/* Comment Section */
.comment-box {
    margin: 40px;
}

input, textarea {
    width: 70%;
    padding: 10px;
    margin: 10px;
    border-radius: 10px;
    border: none;
}

#comments {
    margin-top: 20px;
}

.comment {
    background: rgba(255,255,255,0.1);
    padding: 10px;
    margin: 10px auto;
    width: 70%;
    border-radius: 10px;
    box-shadow: 0 0 10px #00ffff;
}

</style>
</head>

<body>

<header>
🔥 Tamilan Pro Gameing 🎮
</header>

<h2>Neon Anime Gaming Mods Hub</h2>

<div class="game-container">

<div class="game-card">
<h3>NFS MW 2005</h3>
<p>Legendary blacklist racing.</p>
<a href="YOUR_MEDIAFIRE_LINK" target="_blank">
<button>Download Mod</button>
</a>
</div>

<div class="game-card">
<h3>NFS Carbon</h3>
<p>Night canyon battles.</p>
<a href="YOUR_MEDIAFIRE_LINK" target="_blank">
<button>Download Mod</button>
</a>
</div>

<div class="game-card">
<h3>NFS MW 2012</h3>
<p>Modern open world racing.</p>
<a href="YOUR_MEDIAFIRE_LINK" target="_blank">
<button>Download Mod</button>
</a>
</div>

<div class="game-card">
<h3>GTA San Andreas</h3>
<p>Classic open world action.</p>
<a href="YOUR_MEDIAFIRE_LINK" target="_blank">
<button>Download Mod</button>
</a>
</div>

<div class="game-card">
<h3>GTA V</h3>
<p>Ultra realistic gameplay.</p>
<a href="YOUR_MEDIAFIRE_LINK" target="_blank">
<button>Download Mod</button>
</a>
</div>

</div>

<div class="comment-box">
<h2>💬 Comment Section</h2>

<input type="text" id="name" placeholder="Your Name"><br>
<textarea id="comment" placeholder="Write your comment"></textarea><br>
<button onclick="addComment()">Post Comment</button>

<div id="comments"></div>
</div>

<script>
function addComment() {
    var name = document.getElementById("name").value;
    var comment = document.getElementById("comment").value;

    if(name === "" || comment === "") {
        alert("Fill all fields!");
        return;
    }

    var div = document.createElement("div");
    div.className = "comment";
    div.innerHTML = "<b>" + name + "</b>: " + comment;

    document.getElementById("comments").appendChild(div);

    document.getElementById("name").value = "";
    document.getElementById("comment").value = "";
}
</script>

</body>
</html>
